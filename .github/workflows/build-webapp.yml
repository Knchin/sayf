name: Build Web App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build WasmJS Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build WasmJS production bundle
        run: ./gradlew :composeApp:wasmJsBrowserProductionWebpack
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

      - name: Build info
        run: |
          echo "Build completed successfully"
          ls -la composeApp/build/dist/wasmJs/productionExecutable/