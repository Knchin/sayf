name: Build Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Run Android Tests
        run: ./gradlew :composeApp:testDebugUnitTest
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Build info
        run: |
          echo "Android build completed successfully"
          ls -la composeApp/build/outputs/apk/debug/ || true
          ls -la composeApp/build/outputs/apk/release/ || true