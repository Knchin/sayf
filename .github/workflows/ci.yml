name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-common:
    name: Build Common
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build common source set
        run: ./gradlew :composeApp:compileCommonMainKotlinMetadata
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

  build-ios:
    name: Build iOS
    needs: build-common
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/
          retention-days: 7

  build-android:
    name: Build Android
    needs: build-common
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Run Android Tests
        run: ./gradlew :composeApp:testDebugUnitTest
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
          retention-days: 7

  build-web:
    name: Build Web
    needs: build-common
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build WasmJS production bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r composeApp/build/dist/wasmJs/productionExecutable/* deploy/
          echo "Deployment package ready"
          ls -la deploy/

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: deploy/
          retention-days: 7

  deploy-web:
    name: Deploy Web to Cloudflare Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Create or update Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          echo "Creating project 'sayf' (production_branch=master)..."
          CREATE=$(curl -sS -X POST "${API}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"sayf","production_branch":"master"}')
          echo "Create response: ${CREATE}"
          if echo "${CREATE}" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "Project 'sayf' created successfully."
          else
            echo "Create reported a failure (project may already exist). Forcing production_branch=master via update..."
            UPDATE=$(curl -sS -X PATCH "${API}/sayf" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"production_branch":"master"}')
            echo "Update response: ${UPDATE}"
            if ! echo "${UPDATE}" | jq -e '.success == true' > /dev/null 2>&1; then
              echo "::error::Failed to create or update Pages project 'sayf'."
              exit 1
            fi
            echo "Project 'sayf' updated: production_branch=master."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-build --project-name=sayf --branch=master

      - name: Inspect project and verify deployment is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/sayf"
          PROJECT=$(curl -sS "${API}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "Project response: ${PROJECT}"
          echo "--- Project summary ---"
          echo "${PROJECT}" | jq -r '.result | "name=\(.name) subdomain=\(.subdomain) production_branch=\(.production_branch)"'
          echo "${PROJECT}" | jq -r '.result.latest_deployment | "latest_branch=\(.deployment_trigger.metadata.branch // "?") latest_url=\(.url // "?") latest_status=\(.stage // "?")"'
          SUBDOMAIN=$(echo "${PROJECT}" | jq -r '.result.subdomain // empty')
          if [ -z "${SUBDOMAIN}" ]; then
            echo "::error::Could not determine project subdomain from API response."
            exit 1
          fi
          URL="https://${SUBDOMAIN}/"
          echo "Verifying deployment at ${URL}..."
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}" || true)
            echo "Attempt $i: HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "Deployment verified live at ${URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployment not live at ${URL} after 120 seconds."
          exit 1
