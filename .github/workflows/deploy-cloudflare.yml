name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-web:
    name: Deploy Web App to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sayf
          directory: web-build
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  build-webapp:
    name: Build Web App for Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build WasmJS production bundle
        run: ./gradlew :composeApp:wasmJsBrowserProductionWebpack
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r composeApp/build/dist/wasmJs/productionExecutable/* deploy/
          echo "Deployment package ready"
          ls -la deploy/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: deploy/
          retention-days: 7