[versions]
kotlin = "2.0.0"
compose = "1.6.10"
agp = "8.4.0"
coroutines = "1.8.1"
serialization = "1.6.3"
lifecycle = "2.8.0"
activity = "1.9.0"
kotlinxCoroutines = "1.8.1"
kotlinxSerialization = "1.6.3"
compose-bom = "2024.06.00"

[libraries]
kotlin-multiplatform = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:org.jetbrains.compose.gradle.plugin", version.ref = "compose" }
android-application = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-library = { module = "com.android.tools.build:gradle", version.ref = "agp" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3-adaptive = { module = "androidx.compose.material3:material3-adaptive" }
compose-components-resources = { module = "org.jetbrains.compose.components:compose-components-resources" }
compose-ui-platform-android = { module = "androidx.compose.ui:ui-platform-android" }
compose-ui-platform-ios = { module = "org.jetbrains.compose.ui:ui-platform-ios" }
compose-ui-platform-web = { module = "org.jetbrains.compose.ui:ui-platform-web" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-core-js = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-js", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-gradle-plugin = { id = "org.jetbrains.compose.gradle.plugin", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }